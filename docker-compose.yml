# ============================================================
# docker-compose.yml — PyTorch CUDA ML project
# ============================================================
# Usage:
#   docker compose up          — start the container
#   docker compose run ml bash — open an interactive shell
# ============================================================

services:
  ml:
    build:
      context: .
      dockerfile: Dockerfile

    image: ml-project:latest

    # ---- GPU access ----
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # use "1" to limit to a single GPU
              capabilities: [gpu]

    # ---- Runtime flags ----
    runtime: nvidia              # fallback for older Docker versions
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    # ---- Mount project into container ----
    volumes:
      - .:/workspace
      - ml_data:/workspace/data          # persistent dataset volume
      - ml_checkpoints:/workspace/checkpoints  # persistent checkpoint volume

    # ---- Jupyter Lab port (optional) ----
    ports:
      - "8888:8888"

    # ---- Keep container alive for interactive use ----
    stdin_open: true
    tty: true

    working_dir: /workspace

    # ---- Override CMD here if you want a default entrypoint ----
    # command: python train.py

# ---- Named volumes (persist between container restarts) ----
volumes:
  ml_data:
  ml_checkpoints:
